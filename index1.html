<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Wave Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #scroll-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: scroll;
    }
    #image-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background-image: url("static/lyingcat.svg");
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center center;
    }
    #cursor-container {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }
    #sketch-container {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>
</head>

<body>

  </div>

  <div id="cursor-container">
